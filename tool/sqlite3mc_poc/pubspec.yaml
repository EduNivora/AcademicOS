name: sqlite3mc_poc
description: Isolated, non-production proof for SQLite3MC with sqflite_common_ffi.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.41.8'

dependencies:
  flutter:
    sdk: flutter
  path: 1.9.1
  sqflite_common: 2.5.8
  sqlite3: 3.1.7
  sqflite_common_ffi: 2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
