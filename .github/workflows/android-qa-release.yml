name: EduNivora Android QA Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edunivora-qa-release-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa-release:
    name: Test and build ARM64 QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'ndk;28.2.13676358'

      - name: Install CMake
        run: |
          set -euo pipefail
          sdkmanager --install "cmake;3.22.1"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources (errors and warnings are blocking)
        shell: bash
        run: |
          set +e
          dart analyze --format machine > flutter-analyze.machine.log 2>&1
          analyze_status=$?
          set -e
          ANALYZE_STATUS="$analyze_status" python3 - <<'PY'
          import os
          import sys

          analyze_status = int(os.environ["ANALYZE_STATUS"])
          with open("flutter-analyze.machine.log", encoding="utf-8") as report:
              diagnostics = [
                  line.rstrip()
                  for line in report
                  if "|" in line and line.split("|", 1)[0] in {"ERROR", "WARNING", "INFO"}
              ]

          errors = [line for line in diagnostics if line.startswith("ERROR|")]
          warnings = [line for line in diagnostics if line.startswith("WARNING|")]
          infos = [line for line in diagnostics if line.startswith("INFO|")]

          if not diagnostics and analyze_status != 0:
              print("Dart analyzer failed without structured diagnostics.")
              with open("flutter-analyze.machine.log", encoding="utf-8") as report:
                  print(report.read()[:4000])
              sys.exit(2)

          for item in errors + warnings:
              print(item)

          print(
              f"Analyzer summary: {len(errors)} errors, "
              f"{len(warnings)} warnings, {len(infos)} infos."
          )
          if errors or warnings:
              sys.exit(1)
          PY
          if [ "$analyze_status" -ne 0 ]; then
            echo "::notice::Analyzer returned a non-zero status for infos only; no errors or warnings were found."
          fi

      - name: Regenerate release plugin registrant without dev-only plugins
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build --config-only
          registrant="android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
          if [ -f "$registrant" ] && grep -Fq "IntegrationTestPlugin" "$registrant"; then
            echo "::error::Release plugin registrant still contains the dev-only integration_test plugin."
            grep -n "IntegrationTestPlugin" "$registrant" || true
            exit 1
          fi

      - name: Build obfuscated ARM64 QA Release + x86_64 emulator companion (debug-key signature only)
        env:
          ORG_GRADLE_PROJECT_qaRelease: 'true'
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --target-platform android-arm64,android-x64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/qa 2>&1 | tee android-qa-release-build.log



      - name: Run Flutter unit and widget tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 2>&1 | tee flutter-test.log
      - name: Inspect QA APK size composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import zipfile

          apk = Path("build/app/outputs/flutter-apk/app-arm64-v8a-release.apk")
          if not apk.is_file():
              raise SystemExit(f"APK not found: {apk}")
          groups = defaultdict(lambda: [0, 0, 0])
          entries = []
          with zipfile.ZipFile(apk) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  parts = item.filename.split("/")
                  if parts[0] == "lib" and len(parts) > 2:
                      group = "/".join(parts[:2])
                  elif parts[0].startswith("classes") and parts[0].endswith(".dex"):
                      group = "DEX"
                  elif parts[0] == "assets":
                      group = "assets"
                  elif parts[0] == "res":
                      group = "resources"
                  else:
                      group = parts[0]
                  groups[group][0] += item.compress_size
                  groups[group][1] += item.file_size
                  groups[group][2] += 1
                  entries.append((item.compress_size, item.file_size, item.filename))
          lines = [
              f"APK bytes: {apk.stat().st_size}",
              "Largest APK entries (compressed bytes | uncompressed bytes | path):",
          ]
          for compressed, uncompressed, name in sorted(entries, reverse=True)[:40]:
              lines.append(f"{compressed:>12} | {uncompressed:>12} | {name}")
          lines.append("")
          lines.append("APK component groups (compressed bytes | uncompressed bytes | files):")
          for name, values in sorted(groups.items(), key=lambda pair: pair[1][0], reverse=True):
              lines.append(f"{values[0]:>12} | {values[1]:>12} | {values[2]:>5} | {name}")
          report = "\n".join(lines) + "\n"
          Path("APK-COMPONENTS-qa.txt").write_text(report, encoding="utf-8")
          print(report)
          PY
      - name: Verify package, signature, size, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          emulator_apk="build/app/outputs/flutter-apk/app-x86_64-release.apk"
          test -s "$apk"
          test -s "$emulator_apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging "$apk" > apk-badging-qa.txt
          grep -q "package: name='com.arfatalkamli.academicos'" apk-badging-qa.txt
          grep -q "application-label:'EduNivora'" apk-badging-qa.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > apk-signature-qa.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$emulator_apk" > apk-signature-x86_64-qa.txt
          apk_bytes="$(stat -c%s "$apk")"
          apk_mib="$(awk -v bytes="$apk_bytes" 'BEGIN { printf "%.3f", bytes / 1048576 }')"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          printf 'file=%s\nbytes=%s\nMiB=%s\nsha256=%s\nlimit_bytes=31457280\n' \
            "$apk" "$apk_bytes" "$apk_mib" "$sha256" | tee APK-METADATA-qa.txt
          sha256sum "$apk" | tee SHA256SUMS-qa.txt
          if [ "$apk_bytes" -gt 31457280 ]; then
            echo "::error::APK exceeds the mandatory 30 MiB limit. No distributable artifact will be uploaded."
            exit 1
          fi

      - name: Upload verified QA APK and external symbols
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-qa-arm64-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/symbols/qa/**
            apk-badging-qa.txt
            apk-signature-qa.txt
            apk-signature-x86_64-qa.txt
            APK-COMPONENTS-qa.txt
            APK-METADATA-qa.txt
            SHA256SUMS-qa.txt
            android-qa-release-build.log
            flutter-analyze.machine.log
            flutter-test.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics when QA APK verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-qa-failure-diagnostics-${{ github.sha }}
          path: |
            android-qa-release-build.log
            APK-COMPONENTS-qa.txt
            apk-badging-qa.txt
            apk-signature-qa.txt
            APK-METADATA-qa.txt
            SHA256SUMS-qa.txt
            flutter-analyze.machine.log
            flutter-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify SQLite, documents, install, and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/android-qa-emulator.sh

      - name: Upload Android emulator verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-android-emulator-verification-${{ github.sha }}
          path: |
            android-sqlite-integration.log
            android-document-integration.log
            android-emulator-debug-build.log
          if-no-files-found: ignore
          retention-days: 14

