name: EduNivora Android QA Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edunivora-qa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa-release:
    name: Test and build ARM64 QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'ndk;28.2.13676358'

      - name: Install CMake
        run: |
          set -euo pipefail
          sdkmanager --install "cmake;3.22.1"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources (errors and warnings are blocking)
        shell: bash
        run: |
          set +e
          dart analyze --format machine > flutter-analyze.machine.log 2>&1
          analyze_status=$?
          set -e
          ANALYZE_STATUS="$analyze_status" python3 - <<'PY'
          import os
          import sys

          analyze_status = int(os.environ["ANALYZE_STATUS"])
          with open("flutter-analyze.machine.log", encoding="utf-8") as report:
              diagnostics = [
                  line.rstrip()
                  for line in report
                  if "|" in line and line.split("|", 1)[0] in {"ERROR", "WARNING", "INFO"}
              ]

          errors = [line for line in diagnostics if line.startswith("ERROR|")]
          warnings = [line for line in diagnostics if line.startswith("WARNING|")]
          infos = [line for line in diagnostics if line.startswith("INFO|")]

          if not diagnostics and analyze_status != 0:
              print("Dart analyzer failed without structured diagnostics.")
              with open("flutter-analyze.machine.log", encoding="utf-8") as report:
                  print(report.read()[:4000])
              sys.exit(2)

          for item in errors + warnings:
              print(item)

          print(
              f"Analyzer summary: {len(errors)} errors, "
              f"{len(warnings)} warnings, {len(infos)} infos."
          )
          if errors or warnings:
              sys.exit(1)
          PY
          if [ "$analyze_status" -ne 0 ]; then
            echo "::notice::Analyzer returned a non-zero status for infos only; no errors or warnings were found."
          fi

      - name: Run Flutter unit and widget tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 2>&1 | tee flutter-test.log

      - name: Verify SQLite, documents, install, and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            timeout 120 adb wait-for-device
            boot_ready=0
            for probe in $(seq 1 60); do
              boot_state="$(timeout 3 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot_state" = "1" ]; then boot_ready=1; break; fi
              sleep 2
            done
            test "$boot_ready" -eq 1
            package_ready=0
            for probe in $(seq 1 60); do
              if timeout 5 adb shell cmd package list packages >/dev/null 2>&1; then package_ready=1; break; fi
              sleep 3
            done
            test "$package_ready" -eq 1
            run_integration_file() {
              test_file="$1"
              expected_name="$2"
              expected_summary="$3"
              log_file="$4"
              set +e
              timeout 900 flutter test --no-pub -d emulator-5554 "$test_file" > "$log_file" 2>&1
              test_status=$?
              set -e
              cat "$log_file"
              if [ "$test_status" -eq 0 ]; then return 0; fi
              if grep -Fq "$expected_name" "$log_file" &&
                 grep -Fq "$expected_summary" "$log_file" &&
                 grep -Fq "Error waiting for a debug connection: The log reader stopped unexpectedly" "$log_file" &&
                 ! grep -E "Some tests failed|Test failed|Exception caught by flutter test|Expected:|Actual:" "$log_file"; then
                echo "::warning::All asserted tests passed; Flutter reported only its known post-test debug log-reader teardown error."
                return 0
              fi
              return "$test_status"
            }
            run_integration_file               integration_test/database_android_integration_test.dart               "Android native SQLite persists academic rows and attachment BLOBs after reopen"               "1 test passed."               android-sqlite-integration.log
            run_integration_file               integration_test/document_viewer_android_integration_test.dart               "Android Office handoff returns a typed status and preserves launched file"               "2 tests passed."               android-document-integration.log

            flutter build apk --debug --no-pub --target-platform android-x64
            debug_apk="build/app/outputs/flutter-apk/app-debug.apk"
            test -s "$debug_apk"
            adb install -r "$debug_apk"
            adb shell am force-stop com.arfatalkamli.academicos || true
            adb shell monkey -p com.arfatalkamli.academicos 1
            sleep 8
            app_pid="$(adb shell pidof com.arfatalkamli.academicos | tr -d '\r' || true)"
            test -n "$app_pid"
            adb shell dumpsys activity activities | grep -F "com.arfatalkamli.academicos" | head -n 5
            echo "Android emulator smoke launch passed; package PID: $app_pid"

      - name: Build obfuscated ARM64 QA Release (debug-key signature only)
        env:
          ORG_GRADLE_PROJECT_qaRelease: 'true'
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/qa 2>&1 | tee android-qa-release-build.log

      - name: Verify package, signature, size, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging "$apk" > apk-badging-qa.txt
          grep -q "package: name='com.arfatalkamli.academicos'" apk-badging-qa.txt
          grep -q "application-label:'EduNivora'" apk-badging-qa.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > apk-signature-qa.txt
          apk_bytes="$(stat -c%s "$apk")"
          apk_mib="$(awk -v bytes="$apk_bytes" 'BEGIN { printf "%.3f", bytes / 1048576 }')"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          printf 'file=%s\nbytes=%s\nMiB=%s\nsha256=%s\nlimit_bytes=31457280\n' \
            "$apk" "$apk_bytes" "$apk_mib" "$sha256" | tee APK-METADATA-qa.txt
          sha256sum "$apk" | tee SHA256SUMS-qa.txt
          if [ "$apk_bytes" -gt 31457280 ]; then
            echo "::error::APK exceeds the mandatory 30 MiB limit. No distributable artifact will be uploaded."
            exit 1
          fi

      - name: Upload verified QA APK and external symbols
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-qa-arm64-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/symbols/qa/**
            apk-badging-qa.txt
            apk-signature-qa.txt
            APK-METADATA-qa.txt
            SHA256SUMS-qa.txt
            android-qa-release-build.log
            flutter-analyze.machine.log
            flutter-test.log
            android-sqlite-integration.log
            android-document-integration.log
          if-no-files-found: error
          retention-days: 30
