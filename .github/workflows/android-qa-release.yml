name: EduNivora Android QA Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edunivora-qa-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  qa-release:
    name: Test and build ARM64 QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'ndk;28.2.13676358'

      - name: Install CMake
        run: |
          set -euo pipefail
          sdkmanager --install "cmake;3.22.1"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify formatting of changed Dart files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_dart_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- '*.dart' |
              sed -e '/^lib\/data\/database\/database_helper\.dart$/d' \
                  -e '/^lib\/data\/models\/course_model\.dart$/d' \
                  -e '/^lib\/data\/models\/exam_model\.dart$/d' \
                  -e '/^lib\/data\/models\/task_model\.dart$/d' \
                  -e '/^test\/academic_report_service_test\.dart$/d'
          )
          if (("${#changed_dart_files[@]}" > 0)); then
            dart format --output=none --set-exit-if-changed "${changed_dart_files[@]}"
          else
            echo "No in-scope changed Dart files to format."
          fi

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          dart analyze --format machine > flutter-analyze.machine.log 2>&1
          analyze_status=$?
          set -e
          ANALYZE_STATUS="$analyze_status" python3 - <<'PY'
          import os
          import sys

          analyze_status = int(os.environ["ANALYZE_STATUS"])
          with open("flutter-analyze.machine.log", encoding="utf-8") as report:
              diagnostics = [
                  line.rstrip()
                  for line in report
                  if "|" in line and line.split("|", 1)[0] in {"ERROR", "WARNING", "INFO"}
              ]

          errors = [line for line in diagnostics if line.startswith("ERROR|")]
          warnings = [line for line in diagnostics if line.startswith("WARNING|")]
          infos = [line for line in diagnostics if line.startswith("INFO|")]

          if not diagnostics and analyze_status != 0:
              print("Dart analyzer failed without structured diagnostics.")
              with open("flutter-analyze.machine.log", encoding="utf-8") as report:
                  print(report.read()[:4000])
              sys.exit(2)

          for error in errors:
              print(error)
          for warning in warnings:
              print(warning)

          print(
              f"Analyzer summary: {len(errors)} errors, "
              f"{len(warnings)} warnings, {len(infos)} infos."
          )
          if errors or warnings:
              sys.exit(1)
          PY
          if [ "$analyze_status" -ne 0 ]; then
            echo "::notice::Analyzer reported infos only; no errors or warnings were found."
          fi

      - name: Run Flutter tests
        run: flutter test --no-pub --concurrency=1

      - name: Build obfuscated ARM64 QA Release
        env:
          ORG_GRADLE_PROJECT_qaRelease: 'true'
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/qa

      - name: Verify package, signature, size, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging "$apk" > apk-badging-qa.txt
          grep -q "package: name='com.arfatalkamli.academicos'" apk-badging-qa.txt
          grep -q "application-label:'EduNivora'" apk-badging-qa.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > apk-signature-qa.txt
          apk_bytes="$(stat -c%s "$apk")"
          apk_mib="$(awk -v bytes="$apk_bytes" 'BEGIN { printf "%.3f", bytes / 1048576 }')"
          echo "APK size: ${apk_bytes} bytes (${apk_mib} MiB)"
          sha256sum "$apk" | tee SHA256SUMS-qa.txt
          if [ "$apk_bytes" -gt 31457280 ]; then
            echo "::error::APK exceeds the mandatory 30 MiB limit. No distributable artifact will be uploaded."
            exit 1
          fi

      - name: Upload verified QA APK and external symbols
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-qa-arm64-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/symbols/qa/**
            apk-badging-qa.txt
            apk-signature-qa.txt
            SHA256SUMS-qa.txt
          if-no-files-found: error
          retention-days: 30
