name: Flutter quality gate

on:
  pull_request:
    branches: [main, chore/edunivora-phase0-execution, "release1/**"]
  push:
    branches: [main, chore/edunivora-phase0-execution, "release1/**"]

permissions:
  contents: read

concurrency:
  # A newer commit supersedes stale PR checks; only the latest SHA should occupy the runner.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          cache: true

      - name: Set up Android SDK and required NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'ndk;27.0.12077973'

      - name: Install required CMake
        run: |
          set -euo pipefail
          sdkmanager --install "cmake;3.22.1"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          echo "Verified Android CMake 3.22.1."

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v
          echo "Installed Android SDK platforms:"
          ls "$ANDROID_HOME/platforms" || true
          echo "Installed Android NDK versions:"
          ls "$ANDROID_HOME/ndk" || true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart sources
        shell: bash
        run: |
          set +e
          dart analyze --format machine > flutter-analyze.machine.log 2>&1
          analyze_status=$?
          set -e
          ANALYZE_STATUS="$analyze_status" python3 - <<'PY'
          import os
          import sys

          analyze_status = int(os.environ["ANALYZE_STATUS"])
          with open("flutter-analyze.machine.log", encoding="utf-8") as report:
              diagnostics = [
                  line.rstrip()
                  for line in report
                  if "|" in line and line.split("|", 1)[0] in {"ERROR", "WARNING", "INFO"}
              ]

          errors = [line for line in diagnostics if line.startswith("ERROR|")]
          warnings = [line for line in diagnostics if line.startswith("WARNING|")]
          infos = [line for line in diagnostics if line.startswith("INFO|")]

          if not diagnostics and analyze_status != 0:
              print("Dart analyzer failed without structured diagnostics.")
              with open("flutter-analyze.machine.log", encoding="utf-8") as report:
                  print(report.read()[:4000])
              sys.exit(2)

          for error in errors:
              print(error)
          for warning in warnings:
              print(warning)

          print(
              f"Analyzer summary: {len(errors)} errors, "
              f"{len(warnings)} warnings, {len(infos)} infos."
          )
          if errors or warnings:
              sys.exit(1)
          PY
          if [ "$analyze_status" -ne 0 ]; then
            echo "::notice::Analyzer reported infos only; no errors or warnings were found."
          fi

      - name: Run tests
        run: flutter test --no-pub

      - name: Free unused runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --dart-define=EDUNIVORA_GUEST_METRICS_PROXY_URL=${{ vars.EDUNIVORA_GUEST_METRICS_PROXY_URL }}

      # QA remains debug-signed unless the separate production signing inputs
      # are explicitly supplied to the optional production build below.
      - name: Build Android release variant (QA; debug-signed)
        run: flutter build apk --release --no-pub --dart-define=EDUNIVORA_GUEST_METRICS_PROXY_URL=${{ vars.EDUNIVORA_GUEST_METRICS_PROXY_URL }}

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: academicos-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android release QA APK (debug-signed; not for store)
        uses: actions/upload-artifact@v4
        with:
          name: academicos-android-release-qa-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build production-signed Android APK (optional owner configuration)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.EDUNIVORA_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.EDUNIVORA_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.EDUNIVORA_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.EDUNIVORA_ANDROID_KEY_PASSWORD }}
          GUEST_METRICS_PROXY_URL: ${{ vars.EDUNIVORA_GUEST_METRICS_PROXY_URL }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "::notice::Production Android signing secrets are not configured; QA APKs remain available."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "::error::Production Android signing is partially configured. Configure all four EDUNIVORA_ANDROID_* secrets."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/edunivora-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          export EDUNIVORA_ANDROID_KEYSTORE_PATH="$keystore_path"
          export EDUNIVORA_ANDROID_STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
          export EDUNIVORA_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export EDUNIVORA_ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

          flutter build apk --release --no-pub --dart-define=EDUNIVORA_GUEST_METRICS_PROXY_URL="$GUEST_METRICS_PROXY_URL"
          mkdir -p "$RUNNER_TEMP/edunivora-production"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/edunivora-production/edunivora-release.apk"

      - name: Upload production-signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: academicos-android-production-signed-apk
          path: ${{ runner.temp }}/edunivora-production/edunivora-release.apk
          if-no-files-found: ignore
          retention-days: 14
