name: EduNivora AI Flutter checks

on:
  push:
    branches:
      - feat/edunivora-gemini-ai
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/edunivora-ai-flutter-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run focused AI client tests
        run: flutter test --no-pub test/data/datasources/academic_ai_remote_data_source_test.dart
