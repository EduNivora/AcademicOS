name: EduNivora Android ARM64 Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/google-neon-auth-native

permissions:
  contents: read

concurrency:
  group: edunivora-arm64-candidate
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify, and package signed ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/edunivora-production-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate production signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVER_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret or variable: $name"
              exit 1
            fi
          done
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Production keystore is valid."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "ndk;28.2.13676358"

      - name: Install CMake
        run: sdkmanager --install "cmake;3.22.1"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate approved launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build optimized signed ARM64 APK
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --obfuscate
          --split-debug-info=build/symbols/apk
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify package, signature, and APK size
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.arfatalkamli.academicos'" apk-badging.txt
          grep -q "application-label:'EduNivora'" apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          APK_BYTES="$(stat -c%s "$APK")"
          APK_MIB="$(awk -v bytes="$APK_BYTES" 'BEGIN { printf "%.1f", bytes / 1048576 }')"
          echo "Verified ARM64 APK size: ${APK_MIB} MiB"
          if [ "$APK_BYTES" -gt $((60 * 1024 * 1024)) ]; then
            echo "::error::APK exceeds the 60 MiB size target."
            exit 1
          fi
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Upload signed ARM64 APK and symbols
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-arm64-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/symbols/**
            apk-badging.txt
            apk-signature.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
