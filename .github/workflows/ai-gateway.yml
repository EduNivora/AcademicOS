name: AI Gateway CI

on:
  pull_request:
    paths:
      - 'backend/ai/**'
      - '.github/workflows/ai-gateway.yml'
  push:
    branches:
      - feat/edunivora-ai-engine
    paths:
      - 'backend/ai/**'
      - '.github/workflows/ai-gateway.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/ai/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test