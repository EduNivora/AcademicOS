name: Build Neon function bundle

concurrency:
  group: neon-function-bundle-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - chore/edunivora-phase0-execution
      - feat/neon-managed-auth-and-notices
    paths:
      - "backend/neon/functions/notices/**"
      - "package.json"
      - "neon.ts"
      - ".github/workflows/neon-function-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build self-contained Node.js 24 bundle
        run: npm run build:function
      - name: Package deployable function with runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/notices-function"
          mkdir -p "$package_dir"
          cp backend/neon/dist/notices.mjs "$package_dir/index.mjs"
          cat > "$package_dir/package.json" <<'JSON'
          {
            "type": "module",
            "dependencies": {
              "@neon/functions": "0.11.0",
              "hono": "4.9.0",
              "jose": "6.1.0",
              "pg": "8.16.3"
            }
          }
          JSON
          npm install --prefix "$package_dir" --omit=dev --ignore-scripts --no-audit --no-fund
          (cd "$package_dir" && zip -qr "$RUNNER_TEMP/notices-function.zip" .)
      - name: Upload deployable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: notices-function-bundle-${{ github.sha }}
          path: |
            backend/neon/dist/notices.mjs
            ${{ runner.temp }}/notices-function.zip
          if-no-files-found: error
          retention-days: 14
