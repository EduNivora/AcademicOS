name: Build Neon function bundle

on:
  push:
    branches:
      - feat/neon-managed-auth-and-notices
    paths:
      - "backend/neon/functions/notices/**"
      - "package.json"
      - "neon.ts"
      - ".github/workflows/neon-function-bundle.yml"
      - "!backend/neon/dist/**"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build self-contained Node.js 24 bundle
        run: npm run build:function
      - name: Commit generated deployment bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/neon/dist/notices.mjs
          if git diff --cached --quiet; then
            echo "Bundle is already current."
            exit 0
          fi
          git commit -m "build(neon): refresh bundled notices function"
          git push origin HEAD:${{ github.ref_name }}
