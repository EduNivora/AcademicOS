name: Neon backend quality

on:
  pull_request:
    paths:
      - "backend/neon/**"
      - "neon.ts"
      - "package.json"
      - ".github/workflows/neon-backend-quality.yml"
  push:
    branches:
      - main
      - chore/edunivora-phase0-execution
      - feat/neon-managed-auth-and-notices
      - feat/ai-durable-account-quotas
    paths:
      - "backend/neon/**"
      - "neon.ts"
      - "package.json"
      - ".github/workflows/neon-backend-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run backend tests
        run: npm test
      - name: Build AI Neon Function bundle
        run: npm run build:ai
