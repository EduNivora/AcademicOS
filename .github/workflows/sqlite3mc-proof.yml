name: SQLite3MC isolated native proof

on:
  pull_request:
    branches: [chore/edunivora-phase0-execution]
    paths:
      - '.github/workflows/sqlite3mc-proof.yml'
      - 'tool/sqlite3mc_poc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tool/sqlite3mc_poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Generate Android project scaffolding
        run: |
          flutter create --platforms=android --project-name=sqlite3mc_poc --org=org.edunivora .
          rm -f test/widget_test.dart

      - name: Show toolchain
        run: flutter --version && dart --version

      - name: Resolve dependencies and run build hooks
        run: flutter pub get

      - name: Analyze proof package
        run: flutter analyze

      - name: Run native host encryption proof
        run: flutter test

      - name: Build Android debug APK with SQLite3MC
        run: flutter build apk --debug

      - name: Upload proof APK
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3mc-android-proof-debug
          path: tool/sqlite3mc_poc/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Free runner disk space before emulator image
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Run Android emulator encryption proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd tool/sqlite3mc_poc && flutter test integration_test/sqlite3mc_android_test.dart -d emulator-5554
