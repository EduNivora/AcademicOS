name: EduNivora Android Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: edunivora-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-production:
    name: Build and verify signed ABI APKs + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/edunivora-production-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Require production signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [ -z "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            echo "::error::Missing repository variable: GOOGLE_SERVER_CLIENT_ID"
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Production keystore decoded and alias verified."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          cache: true

      - name: Set up Android SDK and required NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "ndk;28.2.13676358"

      - name: Install CMake
        run: sdkmanager --install "cmake;3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate approved launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build production APK for 64-bit Android devices
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --obfuscate
          --split-debug-info=build/symbols/apk
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build production Android App Bundle
        run: >-
          flutter build appbundle --release
          --obfuscate
          --split-debug-info=build/symbols/aab
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify package identity and production signatures
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          shopt -s nullglob
          APKS=("$APK_DIR"/app-arm64-v8a-release.apk)
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          test -s "$AAB"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          : > apk-signature.txt
          for APK in "${APKS[@]}"; do
            echo "Verifying $APK"
            "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-badging-current.txt
            grep -q "package: name='com.arfatalkamli.academicos'" apk-badging-current.txt
            grep -q "application-label:'EduNivora'" apk-badging-current.txt
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" >> apk-signature.txt
            APK_BYTES="$(stat -c%s "$APK")"
            APK_MIB="$((APK_BYTES / 1024 / 1024))"
            echo "Verified arm64 APK size: ${APK_MIB} MiB"
            if [ "$APK_BYTES" -gt $((60 * 1024 * 1024)) ]; then
              echo "::error::arm64 APK exceeds the 60 MiB release target."
              exit 1
            fi
          done
          jarsigner -verify -verbose -certs "$AAB" > aab-signature.txt
          grep -q "jar verified" aab-signature.txt

          sha256sum "${APKS[@]}" "$AAB" | tee SHA256SUMS.txt
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -v | grep -E "SHA1:|SHA256:" | tee upload-certificate-fingerprints.txt
          echo "Verified APK sizes:"
          ls -lh "${APKS[@]}"

      - name: Upload signed APKs and AAB
        uses: actions/upload-artifact@v4
        with:
          name: edunivora-android-production-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
            apk-signature.txt
            aab-signature.txt
            upload-certificate-fingerprints.txt
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
