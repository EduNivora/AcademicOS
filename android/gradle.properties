org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true

# Prevent Gradle from attempting SDK downloads during builds.
# Required SDK components are installed explicitly in CI.
android.builder.sdkDownload=false
kotlin.incremental=true
